[project]
name = "callshield-agent"
version = "0.2.0"
readme = "README.md"
license = "Apache-2.0"
description = "Explainable call-risk analysis with Android screening and a five-node LangGraph pipeline"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "langgraph>=1,<2", "httpx>=0.28,<1", "python-multipart>=0.0.20"]
[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.urls]
Repository = "https://github.com/Stormwang815/callshield-agent"
Issues = "https://github.com/Stormwang815/callshield-agent/issues"
